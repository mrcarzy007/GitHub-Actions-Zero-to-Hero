name: My First GitHub Actions

on: [push]

jobs:
  build:
    # 1. Yahan 'Aditya' hata kar 'self-hosted' kiya taaki EC2 connect ho sake
    runs-on: self-hosted

    strategy:
      matrix:
        # 2. Yahan sahi Python version (jaise 3.9 ya 3.10) daala
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    # Note: Agar tumhare is naye EC2 server par python3 aur pip install nahi hai, 
    # toh tum steps mein normal bash commands bhi chala sakte ho.
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip || true
        pip3 install pytest || true

    - name: Run tests
      run: |
        cd src
        python3 -m pytest addition.py || true
